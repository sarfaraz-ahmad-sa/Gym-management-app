name: fitguide
description: A complete, responsive gym management workspace for mobile and web.
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  http: ^1.5.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.1
  cryptography: ^2.7.0
  url_launcher: ^6.3.2
  file_selector: ^1.0.3
  web: ^1.1.1
  share_plus: ^12.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
