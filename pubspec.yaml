name: fitguide
description: "Gym Management System - Admin panel for members, attendance, trainers, and WhatsApp communication."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  sqflite: ^2.4.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
