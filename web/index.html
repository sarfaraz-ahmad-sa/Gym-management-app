<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FitGuide Pro — members, attendance, memberships and payments, all in one gym management workspace.">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FitGuide Pro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>FitGuide Pro | Your club workspace</title>
  <style>
    html,body {margin:0;background:#f6f8fc;font-family:Arial,sans-serif}
    #loading {position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#174ea6}
    .mark {background:#1a73e8;color:white;font-weight:bold;font-size:28px;padding:20px;border-radius:24px}
    .bar {height:3px;width:110px;background:#d2e3fc;border-radius:4px;overflow:hidden}
    .bar:after {content:'';display:block;width:45px;height:3px;background:#1a73e8;animation:load 1s infinite alternate}
    @keyframes load {to {transform:translateX(65px)}}
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading FitGuide"><div class="mark">FG</div><div>Opening your workspace…</div><div class="bar"></div></div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
